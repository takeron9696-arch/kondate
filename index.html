<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#c2410c">
<title>今日の献立</title>
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --card2:#f4efe7; --line:#e5dcd0;
  --tx:#2c2620; --tx2:#7a6e60; --accent:#c2410c; --accent-w:#fff1e8;
  --ok:#15803d; --ng:#b91c1c; --shadow:0 1px 3px rgba(60,40,20,.08),0 4px 16px rgba(60,40,20,.06);
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#191614; --card:#241f1c; --card2:#2e2823; --line:#3a332d;
    --tx:#f0eae3; --tx2:#a89d90; --accent:#fb923c; --accent-w:#3a2418;
    --ok:#4ade80; --ng:#f87171; --shadow:0 1px 3px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  font-size:16px; line-height:1.6; padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
.wrap{max-width:600px;margin:0 auto;padding:0 14px}
header{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding:14px 0 8px;border-bottom:1px solid var(--line);
}
header .wrap{display:flex;align-items:center;gap:10px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.02em;flex:1}
h1 span{color:var(--accent)}
.sub{font-size:12px;color:var(--tx2);font-weight:400}
main{padding-top:14px}
.page{display:none}
.page.on{display:block}

/* ---- components ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.card.flat{box-shadow:none;background:var(--card2)}
.h2{font-size:13px;font-weight:700;color:var(--tx2);letter-spacing:.08em;margin:20px 0 8px}
.h2:first-child{margin-top:4px}
button{font-family:inherit;font-size:16px;color:inherit;cursor:pointer;border:none;background:none}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--accent);color:#fff;border-radius:11px;padding:13px 18px;
  font-weight:700;font-size:16px;width:100%;transition:transform .08s;
}
.btn:active{transform:scale(.98)}
.btn.sub{background:var(--card);color:var(--tx);border:1px solid var(--line);font-weight:600}
.btn.sm{padding:8px 12px;font-size:13.5px;width:auto;border-radius:9px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);font-weight:600}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
input[type=text],input[type=number],select,textarea{
  font-family:inherit;font-size:16px;color:var(--tx);background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;
}
textarea{resize:vertical;min-height:64px}
label.fl{display:block;font-size:12.5px;color:var(--tx2);font-weight:600;margin:10px 0 4px}
.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:13.5px;
  background:var(--card2);border:1px solid var(--line);border-radius:999px;
  padding:7px 13px;color:var(--tx2);font-weight:600;
}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.ng{background:var(--card);border-color:var(--ng);color:var(--ng)}
.chip.like{background:var(--card);border-color:var(--ok);color:var(--ok)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .chip{flex-shrink:0}
#todayOpts{flex-wrap:wrap;overflow:visible;gap:5px}
#todayOpts .chip{font-size:12.5px;padding:6px 10px}
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav .inner{max-width:600px;margin:0 auto;display:flex}
nav button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--tx2);font-size:10.5px;font-weight:700}
nav button .ic{font-size:21px;line-height:1}
nav button.on{color:var(--accent)}
.empty{text-align:center;color:var(--tx2);font-size:14px;padding:32px 16px;line-height:1.8}

/* ---- dish slot ---- */
.slot{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:none;padding-bottom:2px}
.slot .badge{
  flex-shrink:0;width:44px;text-align:center;font-size:11px;font-weight:700;
  background:var(--accent-w);color:var(--accent);border-radius:7px;padding:5px 0;margin-top:2px;
}
.slot .body{flex:1;min-width:0}
.slot .nm{font-size:17px;font-weight:700;line-height:1.35}
.slot .meta{font-size:12px;color:var(--tx2);margin-top:3px}
.slot .ing{font-size:12.5px;color:var(--tx2);margin-top:5px;line-height:1.6}
.slot .reroll{flex-shrink:0;background:var(--card2);border:1px solid var(--line);border-radius:9px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-top:2px}
.slot .reroll:active{background:var(--accent-w)}

/* ---- lists ---- */
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .nm{font-size:15.5px;font-weight:600;flex:1;min-width:0}
.item .meta{font-size:11.5px;color:var(--tx2);font-weight:400;margin-top:1px}
.star{font-size:19px;letter-spacing:1px;background:none;padding:0 2px;color:var(--tx2)}
.star.on{color:#f59e0b}
.fav{font-size:20px;padding:4px 6px;background:none;color:var(--line)}
.fav.on{color:#f43f5e}
.del{font-size:13px;color:var(--ng);background:none;padding:4px 8px;font-weight:600}
.day{border-left:3px solid var(--accent);padding-left:11px;margin-bottom:14px}
.day .dt{font-size:12.5px;font-weight:700;color:var(--accent);margin-bottom:3px}
.day .dish{display:flex;align-items:flex-start;gap:8px;padding:4px 0}
.day .dish .dn{flex:1;min-width:0;font-size:15.5px;font-weight:700;line-height:1.4}
.day .dish .dm{font-size:11.5px;color:var(--tx2);font-weight:400;margin-top:1px}
.day .dish .reroll{width:30px;height:30px;font-size:13px;flex-shrink:0}
.shop label{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:15px;border-bottom:1px solid var(--line)}
.shop label:last-child{border-bottom:none}
.shop input{width:21px;height:21px;accent-color:var(--accent);flex-shrink:0}
.shop label.done span{text-decoration:line-through;color:var(--tx2)}
.shopcat{font-size:11.5px;font-weight:700;color:var(--tx2);letter-spacing:.06em;margin:14px 0 2px}
.shopcat:first-child{margin-top:0}
.hint{font-size:12.5px;color:var(--tx2);line-height:1.7}
.warn{background:var(--accent-w);color:var(--accent);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
.match{font-size:11.5px;font-weight:700;color:var(--ok)}
.miss{font-size:12px;color:var(--tx2)}
.pill{font-size:11px;background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--tx2);font-weight:600}
.tag{font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 5px;vertical-align:2px;white-space:nowrap;margin-left:4px;display:inline-block}
.tag.b{background:#fde68a;color:#7c2d12}
.tag.k{background:#bbf7d0;color:#14532d}
@media (prefers-color-scheme:dark){.tag.b{background:#78350f;color:#fde68a}.tag.k{background:#14532d;color:#bbf7d0}}
.kids{
  font-size:12.5px;line-height:1.6;margin-top:7px;padding:7px 9px;border-radius:8px;
  background:var(--card2);border-left:3px solid var(--ok);color:var(--tx2);
}
.kids b{color:var(--ok)}
/* レシピ詳細 */
.dt-h{font-size:12px;font-weight:700;color:var(--tx2);letter-spacing:.08em;margin:16px 0 6px}
.dt-h:first-child{margin-top:0}
.dt-ing{display:flex;flex-wrap:wrap;gap:4px 0}
.dt-ing div{width:100%;display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0;border-bottom:1px dotted var(--line)}
.dt-ing div span:last-child{color:var(--tx2);font-variant-numeric:tabular-nums;white-space:nowrap}
.dt-steps{margin:0;padding:0;list-style:none;counter-reset:st}
.dt-steps li{
  counter-increment:st;position:relative;padding:0 0 11px 30px;font-size:14.5px;line-height:1.7;
}
.dt-steps li::before{
  content:counter(st);position:absolute;left:0;top:2px;width:21px;height:21px;
  background:var(--accent);color:#fff;border-radius:50%;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
/* 詳細ダイアログは画面の高さいっぱいまで使い、材料が多くても作り方が見えるようにする */
#dlgDetail[open]{display:flex;flex-direction:column;max-height:90vh}
#dtBody{flex:1;min-height:0}
.tapme{cursor:pointer}
.tapme:active{opacity:.6}
dialog{
  border:none;border-radius:16px;background:var(--card);color:var(--tx);
  padding:18px;max-width:520px;width:calc(100% - 28px);box-shadow:0 20px 60px rgba(0,0,0,.3);
}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-h{font-size:16px;font-weight:700;margin-bottom:4px}
.scrollbox{max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));
  background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:14px;font-weight:700;
  z-index:60;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>今日の<span>献立</span></h1>
    <div class="sub" id="hdMeta"></div>
  </div>
</header>

<main class="wrap">

<!-- ============ 今日 ============ -->
<section class="page on" id="p-today">
  <div class="tabs" id="todayOpts"></div>
  <div id="todayWarn"></div>
  <div class="card" id="todayCard">
    <div class="empty">下のボタンで今日の献立を決めます</div>
  </div>
  <div class="row" style="gap:8px;margin-bottom:12px">
    <button class="btn" id="btnGen">🎲 献立を決める</button>
  </div>
  <div class="row" style="gap:8px" id="todayActions"></div>
  <div class="h2">今いる人（この人たちの苦手を避けます）</div>
  <div class="card flat">
    <div class="row wrap" id="memberToggles"></div>
  </div>
</section>

<!-- ============ 週間 ============ -->
<section class="page" id="p-week">
  <div class="row" style="margin-bottom:12px">
    <button class="btn" id="btnWeek">📅 1週間分をつくる</button>
  </div>
  <div id="weekBody"></div>
</section>

<!-- ============ 冷蔵庫 ============ -->
<section class="page" id="p-fridge">
  <div class="card flat">
    <div class="hint">冷蔵庫にある食材を選ぶと、それで作れる料理を「足りないものが少ない順」に出します。<br>調味料・粉類・にんにく等は常備品として計算から外しています。</div>
  </div>
  <div class="row" style="margin-bottom:10px">
    <input type="text" id="fridgeSearch" placeholder="食材を検索（例：なす）">
    <button class="btn sm sub" id="fridgeClear" style="flex-shrink:0">クリア</button>
  </div>
  <div id="fridgePicker"></div>
  <div class="h2">作れそうな料理</div>
  <div id="fridgeResult"><div class="empty">食材を選んでください</div></div>
</section>

<!-- ============ レシピ ============ -->
<section class="page" id="p-recipe">
  <div class="row" style="margin-bottom:10px">
    <input type="text" id="rcSearch" placeholder="料理名・食材で検索">
    <button class="btn sm ghost" id="btnAddRc" style="flex-shrink:0">＋追加</button>
  </div>
  <div class="tabs" id="rcTabs"></div>
  <div id="rcList"></div>
</section>

<!-- ============ 家族 ============ -->
<section class="page" id="p-family">
  <div class="card flat">
    <div class="hint">家族ごとに<b>苦手な食材</b>を登録すると、その食材を使う料理は提案から外れます。<b>好きな食材</b>は出やすくなります。</div>
  </div>
  <div id="familyList"></div>
  <button class="btn sub" id="btnAddMember">＋ 家族を追加</button>
  <div class="h2">設定</div>
  <div class="card">
    <label class="fl">同じ主菜を避ける日数</label>
    <input type="number" id="setAvoid" min="0" max="60">
    <label class="fl">季節に合った料理を優先</label>
    <div class="row wrap" id="setSeason"></div>
    <label class="fl">データ</label>
    <div class="row wrap">
      <button class="btn sm sub" id="btnExport">バックアップ保存</button>
      <button class="btn sm sub" id="btnImport">復元</button>
      <input type="file" id="fileImport" accept=".json" style="display:none">
    </div>
    <div class="hint" style="margin-top:8px">データはこの端末のブラウザ内にだけ保存されます。機種変更前にバックアップを保存してください。</div>
  </div>
</section>

<!-- ============ 履歴 ============ -->
<section class="page" id="p-history">
  <div id="histBody"></div>
</section>

</main>

<nav><div class="inner">
  <button data-p="today" class="on"><span class="ic">🍚</span>今日</button>
  <button data-p="week"><span class="ic">📅</span>週間</button>
  <button data-p="fridge"><span class="ic">🧊</span>冷蔵庫</button>
  <button data-p="recipe"><span class="ic">📖</span>レシピ</button>
  <button data-p="history"><span class="ic">🕘</span>履歴</button>
  <button data-p="family"><span class="ic">👪</span>家族</button>
</div></nav>

<div class="toast" id="toast"></div>

<!-- ダイアログ：レシピ編集 -->
<dialog id="dlgRecipe">
  <div class="dlg-h" id="dlgRcTitle">レシピを追加</div>
  <label class="fl">料理名</label>
  <input type="text" id="rfName" placeholder="例：ぶりの照り焼き">
  <label class="fl">分類</label>
  <select id="rfCat"></select>
  <label class="fl">ジャンル</label>
  <select id="rfGenre"></select>
  <label class="fl">調理時間（分）</label>
  <input type="number" id="rfTime" min="1" max="240" value="20">
  <label class="fl">材料（カンマ、または改行で区切る）</label>
  <textarea id="rfIng" placeholder="ぶり, 大根, しょうが"></textarea>
  <label class="fl">季節（旬のものだけ）</label>
  <select id="rfSeason"></select>
  <label class="fl">工程数の目安</label>
  <select id="rfSteps">
    <option value="1">1（切る・混ぜる・焼くだけ）</option>
    <option value="2">2（切って焼く／煮るだけ）</option>
    <option value="3">3</option>
    <option value="4">4以上（揚げ物・成形など）</option>
  </select>
  <label class="fl" style="display:flex;align-items:center;gap:8px;margin-top:12px">
    <input type="checkbox" id="rfBento" style="width:20px;height:20px;accent-color:var(--accent)">
    🍱 お弁当のおかずにもなる
  </label>
  <label class="fl">材料と分量（2人分・1行に1つ、または / で区切る）</label>
  <textarea id="rfAmount" placeholder="鶏もも肉 300g&#10;玉ねぎ 1個&#10;醤油 大さじ2"></textarea>
  <label class="fl">作り方（1行に1手順・番号は自動で付きます）</label>
  <textarea id="rfHowto" style="min-height:110px" placeholder="玉ねぎをくし形に切る。&#10;フライパンに油を熱し、鶏肉を皮目から焼く。&#10;調味料を加えて煮からめる。"></textarea>
  <label class="fl">👶 取り分けの手順（大人用と子ども用の作り分け・空欄でOK）</label>
  <textarea id="rfKids" placeholder="例：豆板醤なしで作って子ども用を取り分け、残りに豆板醤を足す。"></textarea>
  <div class="row" style="margin-top:14px">
    <button class="btn sub" id="rfCancel">やめる</button>
    <button class="btn" id="rfSave">保存</button>
  </div>
</dialog>

<!-- ダイアログ：レシピ詳細（分量と作り方） -->
<dialog id="dlgDetail">
  <div class="dlg-h" id="dtName"></div>
  <div class="hint" id="dtMeta"></div>
  <div class="scrollbox" id="dtBody" style="max-height:70vh;margin-top:10px;padding-right:10px"></div>
  <div class="row" style="margin-top:14px">
    <button class="btn sub" id="dtClose" autofocus>閉じる</button>
    <button class="btn" id="dtUse">今日の献立に入れる</button>
  </div>
</dialog>

<!-- ダイアログ：食材選択 -->
<dialog id="dlgIng">
  <div class="dlg-h" id="dlgIngTitle"></div>
  <div class="hint" id="dlgIngHint"></div>
  <input type="text" id="ingSearch" placeholder="食材を検索" style="margin:10px 0">
  <div class="scrollbox" id="ingPicker"></div>
  <div class="row" style="margin-top:14px">
    <button class="btn" id="ingDone">できた</button>
  </div>
</dialog>

<script>
/* ==========================================================
   食材マスター（カテゴリ分け・買い物リストの並び順にも使う）
   ========================================================== */
const ING_CATS = {
  "肉":["鶏もも肉","鶏むね肉","鶏ひき肉","鶏手羽","豚こま肉","豚バラ肉","豚ロース","豚ひき肉","牛薄切り肉","合いびき肉","ベーコン","ウインナー","ハム"],
  "魚介":["鮭","さば","ぶり","あじ","さんま","たら","かじき","いわし","えび","いか","あさり","ほたて","ツナ缶","ちりめんじゃこ","かに風味かまぼこ","ちくわ","さつま揚げ","はんぺん"],
  "野菜":["玉ねぎ","長ねぎ","にんじん","じゃがいも","さつまいも","大根","キャベツ","白菜","レタス","ほうれん草","小松菜","春菊","ニラ","もやし","きゅうり","トマト","なす","ピーマン","パプリカ","ズッキーニ","ブロッコリー","アスパラガス","いんげん","スナップえんどう","オクラ","かぼちゃ","ごぼう","れんこん","里いも","長いも","たけのこ","とうもろこし","セロリ","水菜","チンゲン菜","ゴーヤ","みつば","青じそ","レモン","トマト缶"],
  "きのこ・海藻":["しいたけ","しめじ","まいたけ","エリンギ","えのき","なめこ","マッシュルーム","わかめ","ひじき","昆布","のり","もずく"],
  "豆・卵・乳":["卵","豆腐","厚揚げ","油揚げ","納豆","大豆","おから","高野豆腐","牛乳","チーズ","生クリーム"],
  "主食・麺":["ご飯","うどん","そば","そうめん","中華麺","パスタ","春雨"],
  "その他":["こんにゃく","糸こんにゃく","切り干し大根","キムチ","梅干し","餃子の皮","春巻きの皮","カシューナッツ","くるみ"],
  "常備":["にんにく","しょうが","バター","小麦粉","片栗粉","パン粉","ごま"]
};
const PANTRY = new Set(ING_CATS["常備"]);   // 買い物リストで別枠 & 冷蔵庫マッチから除外
const ING_OF = {};                          // 食材名 -> カテゴリ
for(const [c,list] of Object.entries(ING_CATS)) list.forEach(i=>ING_OF[i]=c);
const CAT_ORDER = Object.keys(ING_CATS);

/* ==========================================================
   レシピデータ  [名前, 分類, ジャンル, 時間, 材料, 季節]
   ========================================================== */
const CATS = ["主菜","副菜","汁物","麺・丼"];
const GENRES = ["和","洋","中"];
const SEASONS = ["春","夏","秋","冬"];
const RAW = [

/* ==========================================================
   状態管理
   ========================================================== */
const KEY = "kondate-v1";
const DEF = {
  custom:[], hidden:[], fav:[], members:[], history:[],
  avoidDays:14, useSeason:true, fridge:[], week:null, shopDone:[],
  todayPlan:null, opts:{maxTime:0, genre:"", oneDish:true, easy:false, bento:false, split:false}
};
let S = load();

/* 保存機能が使える環境かどうか（使えない環境では黙って消えるので明示する） */
const CAN_SAVE = (()=>{
  try{ localStorage.setItem("__test__","1"); localStorage.removeItem("__test__"); return true; }
  catch(e){ return false; }
})();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return structuredClone(DEF);
    const d = JSON.parse(raw);
    const s = Object.assign(structuredClone(DEF), d);
    s.opts = Object.assign(structuredClone(DEF.opts), d.opts||{}); // 新しい条件の初期値を残す
    return s;
  }catch(e){ return structuredClone(DEF); }
}
function save(){
  if(!CAN_SAVE) return;   // 保存できない環境。画面上部で警告済みなので、ここでは静かに続ける
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast("保存できませんでした（空き容量を確認してください）"); }
}

/* 全レシピ（内蔵＋自作） */
let RECIPES = [];
function buildRecipes(){
  RECIPES = RAW.map((r,i)=>({
    id:"b"+i, name:r[0], cat:r[1], genre:r[2], time:r[3],
    ing:r[4].split(",").map(s=>s.trim()).filter(Boolean), season:r[5], own:false,
    steps: STEPS_OVERRIDE[r[0]] ?? autoSteps(r[3]),
    bento: BENTO.has(r[0]),
    kids: KIDS[r[0]] || ""
  })).concat(S.custom.map(r=>({
    ...r, own:true,
    steps: r.steps || autoSteps(r.time),
    bento: !!r.bento,
    kids: r.kids || ""
  }))).filter(r=>!S.hidden.includes(r.id));
}
buildRecipes();

function byId(id){ return RECIPES.find(r=>r.id===id); }

/* ==========================================================
   小道具
   ========================================================== */
const $ = s=>document.querySelector(s);
const $$ = s=>[...document.querySelectorAll(s)];
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let toastT;
function toast(m){
  const t=$("#toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),1900);
}
function today(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(s){
  const d=new Date(s+"T00:00:00");
  const w=["日","月","火","水","木","金","土"][d.getDay()];
  return `${d.getMonth()+1}/${d.getDate()}(${w})`;
}
function daysAgo(s){
  return Math.round((new Date(today()+"T00:00:00") - new Date(s+"T00:00:00"))/86400000);
}
function seasonNow(){
  const m=new Date().getMonth()+1;
  if(m<=2||m===12) return "冬";
  if(m<=5) return "春";
  if(m<=8) return "夏";
  return "秋";
}
const OPP = {"夏":"冬","冬":"夏","春":"秋","秋":"春"};

/* 苦手／好きの集計（今いる人だけ） */
function activeMembers(){ return S.members.filter(m=>m.here!==false); }
function ngSet(){
  const s=new Set();
  activeMembers().forEach(m=>(m.ng||[]).forEach(i=>s.add(i)));
  return s;
}
function likeSet(){
  const s=new Set();
  activeMembers().forEach(m=>(m.like||[]).forEach(i=>s.add(i)));
  return s;
}
function ngReason(r){
  const bad=[];
  activeMembers().forEach(m=>(m.ng||[]).forEach(i=>{ if(r.ing.includes(i)) bad.push(m.name+"が"+i); }));
  return bad;
}

/* 主材料（連日かぶり判定用）= 肉・魚介の最初のもの */
function mainIng(r){
  for(const i of r.ing) if(ING_OF[i]==="肉"||ING_OF[i]==="魚介") return i;
  for(const i of r.ing) if(ING_OF[i]==="豆・卵・乳") return i;
  return r.ing[0]||"";
}

/* 履歴から：最後に作った日／評価平均 */
function lastMade(id){
  for(const h of S.history) if(h.items.includes(id)) return h.date;
  return null;
}
function avgRating(id){
  const rs=S.history.filter(h=>h.items.includes(id)&&h.rating).map(h=>h.rating);
  return rs.length? rs.reduce((a,b)=>a+b,0)/rs.length : null;
}

/* ==========================================================
   提案ロジック
   ========================================================== */
function pool(cat, opt={}){
  const ng=ngSet();
  return RECIPES.filter(r=>{
    if(r.cat!==cat) return false;
    if(r.ing.some(i=>ng.has(i))) return false;
    if(opt.maxTime && r.time>opt.maxTime) return false;
    if(opt.genre && r.genre!==opt.genre) return false;
    if(opt.easy && r.steps>2) return false;
    if(opt.bento && !r.bento) return false;
    if(opt.split && !r.kids) return false;
    return true;
  });
}
/* 条件は枠ごとに効かせる（ジャンルや弁当条件を汁物にまで求めない） */
function slotOpts(cat){
  const o=S.opts;
  const b={maxTime:o.maxTime, easy:o.easy};
  if(cat==="主菜"||cat==="麺・丼"){ b.genre=o.genre; b.bento=o.bento; b.split=o.split; }
  if(cat==="副菜"){ b.bento=o.bento; }
  return b;
}
function score(r, opt={}){
  let s = 1;
  const avoid = Math.max(1, S.avoidDays) * (r.cat==="副菜"||r.cat==="汁物" ? 0.4 : 1);
  const lm = lastMade(r.id);
  if(lm!=null){
    const d = daysAgo(lm);
    s *= d < avoid ? 0.03 + 0.5*(d/avoid) : Math.min(1.8, 0.9 + d/avoid*0.5);
  }else{
    s *= 1.15; // まだ作っていないものを少し優先
  }
  if(S.fav.includes(r.id)) s *= 2.0;
  const lk = likeSet();
  const nl = r.ing.filter(i=>lk.has(i)).length;
  if(nl) s *= 1 + 0.3*nl;
  if(S.useSeason && r.season){
    const now = seasonNow();
    if(r.season===now) s *= 1.8;
    else if(OPP[r.season]===now) s *= 0.3;
    else s *= 0.85;
  }
  const ar = avgRating(r.id);
  if(ar!=null) s *= ar>=2.6 ? 1.7 : ar>=1.8 ? 1.0 : 0.25;
  if(opt.avoidIng && opt.avoidIng.has(mainIng(r))) s *= 0.05;
  if(opt.avoidGenre && opt.avoidGenre===r.genre) s *= 0.35;
  return Math.max(s, 0.001);
}
function pick(cat, opt={}, exclude=[]){
  // 条件がきついときは、ゆるい条件から順に外していく
  const relax = [opt, {...opt,bento:false,split:false}, {...opt,bento:false,split:false,genre:""}, {}];
  let list=[];
  for(const o of relax){
    list = pool(cat,o).filter(r=>!exclude.includes(r.id));
    if(list.length){ opt=o; break; }
  }
  if(!list.length) return null;
  const ws = list.map(r=>score(r,opt));
  const tot = ws.reduce((a,b)=>a+b,0);
  let x = Math.random()*tot;
  for(let i=0;i<list.length;i++){ x-=ws[i]; if(x<=0) return list[i]; }
  return list[list.length-1];
}

function genToday(){
  const o = S.opts;
  const oneDish = o.oneDish && !o.bento && Math.random()<0.3;
  const plan = {date:today(), slots:[]};
  if(oneDish){
    const m = pick("麺・丼",slotOpts("麺・丼"));
    if(m) plan.slots.push({label:"主食",id:m.id});
    const s = pick("副菜",slotOpts("副菜"),[m&&m.id].filter(Boolean));
    if(s) plan.slots.push({label:"副菜",id:s.id});
  }else{
    const m = pick("主菜",slotOpts("主菜"));
    if(m) plan.slots.push({label:"主菜",id:m.id});
    const s = pick("副菜",slotOpts("副菜"),[m&&m.id].filter(Boolean));
    if(s) plan.slots.push({label:"副菜",id:s.id});
    const sp = pick("汁物",slotOpts("汁物"));
    if(sp) plan.slots.push({label:"汁物",id:sp.id});
  }
  S.todayPlan = plan.slots.length? plan : null;
  save(); renderToday();
}
function reroll(idx){
  const p = S.todayPlan; if(!p) return;
  const slot = p.slots[idx];
  const cat = slot.label==="主食" ? "麺・丼" : slot.label;
  const r = pick(cat, slotOpts(cat), p.slots.map(s=>s.id));
  if(!r){ toast("他に候補がありません"); return; }
  slot.id = r.id; save(); renderToday();
}
function addSlot(cat,label){
  if(!S.todayPlan) S.todayPlan={date:today(),slots:[]};
  const r = pick(cat,slotOpts(cat),S.todayPlan.slots.map(s=>s.id));
  if(!r){ toast("候補がありません"); return; }
  S.todayPlan.slots.push({label,id:r.id}); save(); renderToday();
}

/* 1週間 */
function genWeek(){
  const o = S.opts;
  const days=[]; const recentIng=[]; let prevGenre="";
  const usedMain=[], usedSide=[], usedSoup=[]; let oneDishCount=0;
  const start = new Date();
  for(let d=0; d<7; d++){
    const date = new Date(start.getTime()+d*86400000).toISOString().slice(0,10);
    const avoidIng = new Set(recentIng.slice(-3));
    const wantOne = o.oneDish && oneDishCount<2 && (d===4||d===6) ;
    const slots=[];
    const mainCat = wantOne ? "麺・丼" : "主菜";
    const m = pick(mainCat,{...slotOpts(mainCat),avoidIng,avoidGenre:prevGenre},usedMain);
    if(m){
      slots.push({label: wantOne?"主食":"主菜", id:m.id});
      usedMain.push(m.id); recentIng.push(mainIng(m)); prevGenre=m.genre;
      if(wantOne) oneDishCount++;
    }
    const s = pick("副菜",slotOpts("副菜"),[...usedSide,...slots.map(x=>x.id)]);
    if(s){ slots.push({label:"副菜",id:s.id}); usedSide.push(s.id); }
    if(!wantOne){
      const sp = pick("汁物",slotOpts("汁物"),[...usedSoup,...slots.map(x=>x.id)]);
      if(sp){ slots.push({label:"汁物",id:sp.id}); usedSoup.push(sp.id); }
    }
    days.push({date,slots});
  }
  S.week={made:today(),days}; S.shopDone=[]; save(); renderWeek();
}

      ${kids.length?`<div class="kids">👶 <b>取り分け</b> ${kids.map(r=>esc(r.name)+"："+esc(r.kids)).join("／")}</div>`:""}
    </div>`;
  });

  // 買い物リスト
  const need = {};
  w.days.forEach(d=>d.slots.forEach(s=>{

  });
  html += `<div class="h2">買い物リスト（${Object.keys(need).length}品）</div><div class="card shop">`;

let fridgeQ="";
function renderFridge(){
  const q=fridgeQ.trim();
  let html="";
  CAT_ORDER.filter(c=>c!=="常備").forEach(c=>{
    let list = ING_CATS[c].filter(i=>!q||i.includes(q));
    if(!list.length) return;
    html += `<div class="shopcat">${c}</div><div class="row wrap" style="gap:6px;margin-bottom:6px">`+
      list.map(i=>`<button class="chip ${S.fridge.includes(i)?"on":""}" data-fr="${esc(i)}">${esc(i)}</button>`).join("")+
      `</div>`;
  });
  $("#fridgePicker").innerHTML = html || `<div class="hint">該当する食材がありません</div>`;

  const have=new Set(S.fridge);
  if(!have.size){ $("#fridgeResult").innerHTML=`<div class="empty">食材を選んでください</div>`; return; }
  const ng=ngSet();
  const scored = RECIPES.filter(r=>!r.ing.some(i=>ng.has(i))).map(r=>{
    const core = r.ing.filter(i=>!PANTRY.has(i));
    const hit = core.filter(i=>have.has(i));
    const miss = core.filter(i=>!have.has(i));
    return {r,hit,miss,ratio: core.length? hit.length/core.length : 0};
  }).filter(x=>x.hit.length>0)
    .sort((a,b)=> a.miss.length-b.miss.length || b.hit.length-a.hit.length || b.ratio-a.ratio)
    .slice(0,25);
  if(!scored.length){ $("#fridgeResult").innerHTML=`<div class="empty">その食材を使う料理が見つかりませんでした</div>`; return; }
  $("#fridgeResult").innerHTML = `<div class="card">`+scored.map(x=>`
    <div class="item">
      <div class="grow tapme" data-det="${x.r.id}">
        <div class="nm">${esc(x.r.name)}${x.r.bento?'<span class="tag b">🍱</span>':""}${x.r.kids?'<span class="tag k">👶</span>':""}
          <div class="meta">${x.r.cat}・${x.r.genre}食・${x.r.time}分・工程${x.r.steps}</div>
          <div class="meta"><span class="match">あり: ${x.hit.map(esc).join("・")}</span>${x.miss.length?`<br><span class="miss">買う: ${x.miss.map(esc).join("・")}</span>`:`<br><span class="match">これだけで作れます</span>`}</div>
        </div>
      </div>
      <button class="btn sm ghost" data-fadd="${x.r.id}">使う</button>
    </div>`).join("")+`</div>`;
}

let rcTab="すべて", rcQ="";
function renderRecipes(){
  const tabs=["すべて","お気に入り","🍱弁当OK","👶取り分け","🔪工程少なめ",...CATS,"自分のレシピ"];
  $("#rcTabs").innerHTML = tabs.map(t=>`<button class="chip ${rcTab===t?"on":""}" data-rt="${t}">${t}</button>`).join("");
  const q=rcQ.trim();
  let list = RECIPES.filter(r=>{
    if(rcTab==="お気に入り" && !S.fav.includes(r.id)) return false;
    if(rcTab==="自分のレシピ" && !r.own) return false;
    if(rcTab==="🍱弁当OK" && !r.bento) return false;
    if(rcTab==="👶取り分け" && !r.kids) return false;
    if(rcTab==="🔪工程少なめ" && r.steps>2) return false;
    if(CATS.includes(rcTab) && r.cat!==rcTab) return false;
    if(q && !(r.name.includes(q)||r.ing.some(i=>i.includes(q)))) return false;
    return true;
  });
  list.sort((a,b)=> CATS.indexOf(a.cat)-CATS.indexOf(b.cat) || a.name.localeCompare(b.name,"ja"));
  if(!list.length){ $("#rcList").innerHTML=`<div class="empty">該当なし</div>`; return; }
  const ng=ngSet();
  $("#rcList").innerHTML = `<div class="hint" style="margin-bottom:8px">${list.length}品</div><div class="card">`+list.map(r=>{
    const bad = ngReason(r);
    const ar = avgRating(r.id);
    return `<div class="item">
      <button class="fav ${S.fav.includes(r.id)?"on":""}" data-fv="${r.id}">♥</button>
      <div class="grow tapme" data-det="${r.id}">
        <div class="nm">${esc(r.name)} ${r.own?'<span class="pill">自作</span>':""}${r.bento?'<span class="tag b">🍱</span>':""}${r.kids?'<span class="tag k">👶</span>':""}</div>
        <div class="meta">${r.cat}・${r.genre}食・${r.time}分・工程${r.steps}${r.season?"・旬:"+r.season:""}${ar?"・★"+ar.toFixed(1):""}</div>
        <div class="meta">${r.ing.map(i=>ng.has(i)?`<span style="color:var(--ng);font-weight:700">${esc(i)}</span>`:esc(i)).join("・")}</div>
        ${r.kids?`<div class="kids">👶 <b>取り分け</b> ${esc(r.kids)}</div>`:""}
        ${bad.length?`<div class="meta" style="color:var(--ng)">${bad.map(esc).join("・")}が苦手 → 提案から除外中</div>`:""}
      </div>
      ${r.own?`<button class="btn sm sub" data-red="${r.id}">編集</button>`:`<button class="del" data-rh="${r.id}">隠す</button>`}
    </div>`;
  }).join("")+`</div>`;
}

let detailId=null;
function openDetail(id){
  const r=byId(id); if(!r) return;
  detailId=id;
  $("#dtName").innerHTML = esc(r.name)
    + (S.fav.includes(r.id)?' <span class="tag k">♥お気に入り</span>':"")
    + (r.bento?'<span class="tag b">🍱弁当OK</span>':"")
    + (r.kids?'<span class="tag k">👶取り分け</span>':"");
  $("#dtMeta").textContent =
    `${r.cat}・${r.genre}食・調理${r.time}分・工程${r.steps}${r.season?"・旬は"+r.season:""}`;

  // 材料の区切りは / だが「1/2本」のような分数も / を使うため、
  // 数字が続く / は分数と見なして区切らない
  const splitIng = s => s.split(/\n|\/(?![0-9０-９])/).map(x=>x.trim()).filter(Boolean);

  const d = r.own
    ? {amount:splitIng(r.amount||""),
       steps:(r.howto||"").split("\n").map(s=>s.trim()).filter(Boolean)}
    : (()=>{ const h=HOWTO[r.name];
        return h? {amount:splitIng(h[0]), steps:h.slice(1)}
                : {amount:[], steps:[]}; })();

  let html = `<div class="dt-h">材料（2人分）</div>`;
  if(d.amount.length){
    html += `<div class="dt-ing">` + d.amount.map(a=>{
      // 「はちみつ 大さじ2」は空白で、「鶏もも肉2枚」は数字の手前で分ける
      const sp = a.lastIndexOf(" ");
      let name, qty;
      if(sp > 0){ name = a.slice(0,sp); qty = a.slice(sp+1); }
      else {
        const m = a.match(/^(.+?)([0-9０-９].*|少々|適量|ひとつまみ)$/);
        if(m){ name = m[1]; qty = m[2]; } else { name = a; qty = ""; }
      }
      return `<div><span>${esc(name)}</span><span>${esc(qty)}</span></div>`;
    }).join("") + `</div>`;
  }else{
    html += `<div class="hint">${r.ing.map(esc).join("・")}<br>（分量は未登録）</div>`;
  }

  html += `<div class="dt-h">作り方</div>`;
  html += d.steps.length
    ? `<ol class="dt-steps">${d.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`
    : `<div class="hint">作り方は登録されていません。${r.own?"レシピタブの「編集」から書き込めます。":""}</div>`;

  if(r.kids) html += `<div class="kids">👶 <b>取り分け</b> ${esc(r.kids)}</div>`;
  if(r.bento) html += `<div class="kids" style="border-left-color:#f59e0b">🍱 <b style="color:#b45309">お弁当</b> 冷めてもおいしく、汁気が少ないので詰めやすい一品です。</div>`;
  $("#dtBody").innerHTML = html;
  $("#dlgDetail").showModal();
}

  };

/* ==========================================================
   イベント
   ========================================================== */
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-p],[data-o],[data-rr],[data-mt],[data-wrr],[data-fr],[data-fadd],[data-rt],[data-fv],[data-red],[data-rh],[data-mng],[data-mlk],[data-mdel],[data-ip],[data-hr],[data-hd],[data-det],button");
  if(!t) return;

  // レシピ詳細を開く（分量と作り方）
  if(t.dataset.det){ openDetail(t.dataset.det); return; }
  if(t.id==="dtClose"){ $("#dlgDetail").close(); return; }
  if(t.id==="dtUse"){
    const r=byId(detailId); if(!r) return;
    if(!S.todayPlan) S.todayPlan={date:today(),slots:[]};
    const label = r.cat==="麺・丼"?"主食":r.cat;
    S.todayPlan.slots = S.todayPlan.slots.filter(s=>s.label!==label);
    S.todayPlan.slots.push({label,id:r.id});
    const order=["主菜","主食","副菜","汁物"];
    S.todayPlan.slots.sort((a,b)=>order.indexOf(a.label)-order.indexOf(b.label));
    save(); $("#dlgDetail").close(); renderToday();
    toast(`「${r.name}」を今日の献立に入れました`); return;
  }

  // タブ切替
  if(t.dataset.p){
    $$("nav button").forEach(b=>b.classList.toggle("on",b===t));
    $$(".page").forEach(p=>p.classList.toggle("on",p.id==="p-"+t.dataset.p));
    window.scrollTo(0,0);
    const f={today:renderToday,week:renderWeek,fridge:renderFridge,recipe:renderRecipes,family:renderFamily,history:renderHistory}[t.dataset.p];
    f&&f(); return;
  }
  // 今日：条件
  if(t.dataset.o){
    const o=S.opts;
    if(t.dataset.o==="time") o.maxTime = o.maxTime?0:20;
    if(t.dataset.o==="one") o.oneDish = !o.oneDish;
    if(t.dataset.o==="easy") o.easy = !o.easy;
    if(t.dataset.o==="bento") o.bento = !o.bento;
    if(t.dataset.o==="split") o.split = !o.split;
    if(t.dataset.o==="g") o.genre = o.genre===t.dataset.v? "":t.dataset.v;
    save(); renderToday(); return;
  }
  if(t.dataset.rr!=null){ reroll(+t.dataset.rr); return; }
  if(t.dataset.mt){
    const m=S.members.find(x=>x.id===t.dataset.mt);
    m.here = m.here===false; save(); renderToday(); return;
  }
  if(t.id==="btnGen"){ genToday(); return; }
  if(t.id==="btnMade"){
    const p=S.todayPlan; if(!p) return;
    S.history.unshift({date:today(),items:p.slots.map(s=>s.id),rating:null});
    save(); toast("記録しました"); renderToday(); return;
  }
  if(t.id==="btnMore"){
    const n=S.todayPlan.slots.length;
    addSlot("副菜","副菜"); return;
  }

  // 週間
  if(t.id==="btnWeek"){ genWeek(); return; }
  if(t.dataset.wrr){
    const [di,si]=t.dataset.wrr.split(",").map(Number);
    const d=S.week.days[di], slot=d.slots[si];
    const cat = slot.label==="主食"?"麺・丼":slot.label;
    const used = S.week.days.flatMap(x=>x.slots.map(y=>y.id));
    const r=pick(cat,slotOpts(cat),used);
    if(!r){ toast("他に候補がありません"); return; }
    slot.id=r.id; save(); renderWeek(); return;
  }
  if(t.id==="btnWeekCopy"){
    const need=new Set();
    S.week.days.forEach(d=>d.slots.forEach(s=>{const r=byId(s.id); r&&r.ing.forEach(i=>{if(!S.shopDone.includes(i))need.add(i);});}));
    const txt=[...need].sort((a,b)=>CAT_ORDER.indexOf(ING_OF[a]||"その他")-CAT_ORDER.indexOf(ING_OF[b]||"その他")).join("\n");
    navigator.clipboard?.writeText(txt).then(()=>toast("コピーしました"),()=>toast("コピーできませんでした"));
    return;
  }

  // 冷蔵庫
  if(t.dataset.fr){
    const i=t.dataset.fr;
    const k=S.fridge.indexOf(i);
    if(k>=0) S.fridge.splice(k,1); else S.fridge.push(i);
    save(); renderFridge(); return;
  }
  if(t.id==="fridgeClear"){ S.fridge=[]; save(); renderFridge(); return; }
  if(t.dataset.fadd){
    const r=byId(t.dataset.fadd);
    if(!S.todayPlan) S.todayPlan={date:today(),slots:[]};
    const label = r.cat==="麺・丼"?"主食":r.cat;
    S.todayPlan.slots = S.todayPlan.slots.filter(s=>s.label!==label);
    S.todayPlan.slots.push({label,id:r.id});
    const order=["主菜","主食","副菜","汁物"];
    S.todayPlan.slots.sort((a,b)=>order.indexOf(a.label)-order.indexOf(b.label));
    save(); toast(`「${r.name}」を今日の献立に入れました`); return;
  }

  // レシピ
  if(t.dataset.rt){ rcTab=t.dataset.rt; renderRecipes(); return; }
  if(t.id==="btnAddRc"){ openRecipe(null); return; }
  if(t.dataset.fv){
    const id=t.dataset.fv, k=S.fav.indexOf(id);
    if(k>=0) S.fav.splice(k,1); else S.fav.push(id);
    save(); renderRecipes(); return;
  }
  if(t.dataset.red){ openRecipe(t.dataset.red); return; }
  if(t.dataset.rh){
    const r=byId(t.dataset.rh);
    if(!confirm(`「${r.name}」を一覧から隠しますか？（提案されなくなります）`)) return;
    S.hidden.push(t.dataset.rh); save(); buildRecipes(); renderRecipes(); return;
  }
  if(t.id==="rfCancel"){ $("#dlgRecipe").close(); return; }
  if(t.id==="rfSave"){ saveRecipe(); return; }

  // 家族
  if(t.id==="btnAddMember"){
    const name=prompt("名前を入れてください（例：ゆうた）");
    if(!name) return;
    S.members.push({id:"m"+Date.now(),name:name.trim(),ng:[],like:[],here:true});
    save(); renderFamily(); renderToday(); return;
  }
  if(t.dataset.mdel){
    const m=S.members.find(x=>x.id===t.dataset.mdel);
    if(!confirm(`${m.name} を削除しますか？`)) return;
    S.members=S.members.filter(x=>x.id!==t.dataset.mdel);
    save(); renderFamily(); renderToday(); return;
  }
  if(t.dataset.mng){ openIng(t.dataset.mng,"ng"); return; }
  if(t.dataset.mlk){ openIng(t.dataset.mlk,"like"); return; }
  if(t.dataset.ip){
    const m=S.members.find(x=>x.id===ingTarget.mid);
    const f=ingTarget.field; m[f]=m[f]||[];
    const k=m[f].indexOf(t.dataset.ip);
    if(k>=0) m[f].splice(k,1); else m[f].push(t.dataset.ip);
    save(); drawIngPicker(); return;
  }
  if(t.id==="ingDone"){ $("#dlgIng").close(); renderFamily(); renderToday(); return; }
  if(t.id==="tgSeason"){ S.useSeason=!S.useSeason; save(); renderFamily(); return; }
  if(t.id==="btnExport"){
    const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=`献立データ_${today()}.json`; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    toast("保存しました"); return;
  }
  if(t.id==="btnImport"){ $("#fileImport").click(); return; }

  // 履歴
  if(t.dataset.hr){
    const [i,n]=t.dataset.hr.split(",").map(Number);
    S.history[i].rating = S.history[i].rating===n? null:n;
    save(); renderHistory(); return;
  }
  if(t.dataset.hd){
    S.history.splice(+t.dataset.hd,1); save(); renderHistory(); return;
  }
});

document.addEventListener("change", e=>{
  const t=e.target;
  if(t.dataset.sh){
    const i=t.dataset.sh, k=S.shopDone.indexOf(i);
    if(t.checked && k<0) S.shopDone.push(i);
    if(!t.checked && k>=0) S.shopDone.splice(k,1);
    save(); t.closest("label").classList.toggle("done",t.checked); return;
  }
  if(t.id==="setAvoid"){ S.avoidDays=Math.max(0,Math.min(60,parseInt(t.value)||0)); save(); return; }
  if(t.dataset.mn){
    const m=S.members.find(x=>x.id===t.dataset.mn);
    m.name=t.value.trim()||m.name; save(); renderToday(); return;
  }
  if(t.id==="fileImport" && t.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const d=JSON.parse(fr.result);
        if(!confirm("今のデータを上書きして復元しますか？")) return;
        S=Object.assign(structuredClone(DEF),d); save(); buildRecipes();
        renderToday(); renderFamily(); toast("復元しました");
      }catch(err){ toast("読み込めませんでした"); }
    };
    fr.readAsText(t.files[0]); t.value=""; return;
  }
});

$("#fridgeSearch").addEventListener("input",e=>{ fridgeQ=e.target.value; renderFridge(); });
$("#rcSearch").addEventListener("input",e=>{ rcQ=e.target.value; renderRecipes(); });
$("#ingSearch").addEventListener("input",e=>{ ingQ=e.target.value; drawIngPicker(); });

/* 初期化：初回は家族1人を用意 */
if(!S.members.length && !S.history.length){
  S.members=[{id:"m0",name:"わたし",ng:[],like:[],here:true}];
  save();
}
renderToday();

/* 保存できない環境なら、はっきり伝える */
if(!CAN_SAVE){
  const b=document.createElement("div");
  b.className="warn";
  b.style.margin="0 0 12px";
  b.textContent="⚠ この環境では家族の設定や履歴が保存できません。ページを閉じると消えます。ずっと使うには、ファイルを端末に保存してブラウザで開いてください。";
  $("main").prepend(b);
}
</script>
</body>
</html>
